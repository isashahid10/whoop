name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PINNED, not `channel: stable`. A floating channel silently changes the
      # toolchain under the repo: the first run of this workflow failed because
      # stable had moved to 3.44.8 while local dev was on 3.41.6, and
      # CupertinoPageTransitionsBuilder had moved between cupertino.dart and
      # material.dart in between — analyze was clean on one and five errors on
      # the other. Same reasoning as the commit-SHA pins for sibling packages in
      # pubspec.yaml. Bump this deliberately.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      # Sibling packages resolve from their pinned commit SHAs in pubspec.yaml.
      # There is no pubspec_overrides.yaml here — that file is gitignored and
      # local-dev only — so CI tests exactly the pins a release would ship.
      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # --concurrency=1: the suite uses sqflite_common_ffi against real database
      # files, and parallel workers race on them.
      #
      # The golden capture (whoop_hist.jsonl) is a real band recording kept
      # beside the repo rather than committed to it, so the two derivation-replay
      # tests SKIP here and run locally.
      - name: Test
        run: flutter test --concurrency=1 --reporter=expanded
