name: A number looks wrong
description: A health metric is showing a value you do not believe
labels: ["metric", "needs-data"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: some numbers are **deliberately** blank or conservative.

        - Correlations need 14 paired days, bulk quality needs 10 weigh-ins,
          readiness needs a baseline. Blank means "not enough data yet", and the
          card says which.
        - **Deep sleep is known to be unreliable** and reads low on many nights.
          This is investigated and documented in
          [docs/METHODOLOGY.md](../../docs/METHODOLOGY.md#deep-sleep) — please read
          that section before filing about deep sleep specifically.

        A number being *surprising* is not the same as it being *wrong*. The most
        useful report includes something to check it against.

  - type: input
    id: metric
    attributes:
      label: Which number
      placeholder: e.g. Deep sleep, Readiness, Steps, Estimated 1RM
    validations:
      required: true

  - type: input
    id: shown
    attributes:
      label: What it showed
      placeholder: e.g. 8 minutes
    validations:
      required: true

  - type: input
    id: expected
    attributes:
      label: What you expected, and why
      description: A reference source is far more useful than an intuition.
      placeholder: e.g. ~90 min; Apple Watch on the same night said 84
    validations:
      required: true

  - type: input
    id: date
    attributes:
      label: Date it applies to
      placeholder: 2026-08-02
    validations:
      required: true

  - type: dropdown
    id: reference
    attributes:
      label: Do you have anything to check it against?
      options:
        - "No, it just seems off"
        - "Another wearable"
        - "A sleep study / clinical measurement"
        - "A manual measurement I trust"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything unusual about that day or night
      description: >
        Alcohol, illness, travel, a very late session, the band worn loosely, a
        long charging gap. Context often explains the number rather than
        contradicting it.

  - type: checkboxes
    id: ack
    attributes:
      label: Confirmations
      options:
        - label: I read the relevant section of docs/METHODOLOGY.md
          required: true
        - label: I understand every number here is a wrist-sensor estimate, not a clinical measurement
          required: true
